name: Verify experiment
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run demo
      - run: docker compose run --rm --build experiment
      - run: docker compose run --rm experiment reproduce-all /app/results
